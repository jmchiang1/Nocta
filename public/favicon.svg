    <radialGradient id="g" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#f4b896"/>
      <stop offset="0.55" stop-color="#f0a47a"/>
      <stop offset="1" stop-color="#d97f4f"/>
    </radialGradient>
    <mask id="bite">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="82" cy="20" r="25" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="53" r="42" fill="url(#g)" mask="url(#bite)"/>
  <rect x="30.8" y="45.65" width="12.4" height="18.7" rx="6.2" fill="#1a1424"/>
  <rect x="48.8" y="45.65" width="12.4" height="18.7" rx="6.2" fill="#1a1424"/>
